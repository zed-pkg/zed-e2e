name: Apply DEN-2913

on:
  push:
    branches:
      - alexanderdmills/den-2913-zed-e2e-live-cloud-public-edge-workflows-still-target

permissions:
  contents: write

concurrency:
  group: den-2913-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the zpkg.net endpoint contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "https://registry.aws.zpkg.tech": "https://registry.aws.zpkg.net",
              "https://registry.hetzner.zpkg.tech": "https://registry.hetzner.zpkg.net",
              "https://aws.zpkg.tech": "https://web.aws.zpkg.net",
              "https://hetzner.zpkg.tech": "https://web.hetzner.zpkg.net",
          }
          files = (
              Path(".github/workflows/live-opto-sync-cloud.yml"),
              Path(".github/workflows/public-edge-readiness.yml"),
              Path("docs/live-opto-sync-cloud.md"),
              Path("docs/public-edge-readiness.md"),
          )

          totals = {old: 0 for old in replacements}
          for path in files:
              original = path.read_text()
              updated = original
              for old, new in replacements.items():
                  count = updated.count(old)
                  totals[old] += count
                  updated = updated.replace(old, new)
              path.write_text(updated)

          expected = {
              "https://registry.aws.zpkg.tech": 4,
              "https://registry.hetzner.zpkg.tech": 4,
              "https://aws.zpkg.tech": 2,
              "https://hetzner.zpkg.tech": 2,
          }
          if totals != expected:
              raise SystemExit(f"unexpected endpoint inventory: {totals!r}; expected {expected!r}")
          PY

      - name: Validate the transformed contract
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n 'zpkg\.tech' -- \
            .github/workflows/live-opto-sync-cloud.yml \
            .github/workflows/public-edge-readiness.yml \
            docs/live-opto-sync-cloud.md \
            docs/public-edge-readiness.md
          test "$(git grep -h -o 'registry\.aws\.zpkg\.net' -- .github/workflows docs | wc -l)" -eq 4
          test "$(git grep -h -o 'registry\.hetzner\.zpkg\.net' -- .github/workflows docs | wc -l)" -eq 4
          test "$(git grep -h -o 'web\.aws\.zpkg\.net' -- .github/workflows docs | wc -l)" -eq 2
          test "$(git grep -h -o 'web\.hetzner\.zpkg\.net' -- .github/workflows docs | wc -l)" -eq 2
          bash -n scripts/check-zed-public-edge.sh
          git diff --check

      - name: Commit the validated endpoint migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-den-2913.yml
          git config user.name "alex-main-agent"
          git config user.email "alex-main-agent@users.noreply.github.com"
          git add \
            .github/workflows/agent-den-2913.yml \
            .github/workflows/live-opto-sync-cloud.yml \
            .github/workflows/public-edge-readiness.yml \
            docs/live-opto-sync-cloud.md \
            docs/public-edge-readiness.md
          git diff --cached --check
          git commit -m "fix(e2e): target zpkg.net public edges (DEN-2913)"
          git push origin HEAD
