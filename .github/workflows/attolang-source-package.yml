name: AttoLang source-package boundary (real Zed; no compiler)

on:
  pull_request:
    paths:
      - '.github/workflows/attolang-source-package.yml'
      - 'suites/cli/attolang-source-package-boundary.sh'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/attolang-source-package.yml'
      - 'suites/cli/attolang-source-package-boundary.sh'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attolang-source-boundary-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact zed-e2e PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: zed-e2e
      - name: Verify exact E2E test tree
        env:
          EXPECTED_E2E_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C zed-e2e rev-parse HEAD)" = "$EXPECTED_E2E_SHA"
      # Exact tested lock-graph repair head from zed-cli #554. This is an
      # isolated PR validation pin; release consumers must repin to an
      # independently reviewed and merged CLI revision.
      - name: Check out pinned Zed CLI for source package proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: zed-pkg/zed-cli
          ref: f5d0faafef7c8c73b230f22e02ddb5bf8b178b6c
          path: zed-cli
      - name: Verify pinned CLI tree identity
        run: test "$(git -C zed-cli rev-parse HEAD)" = "f5d0faafef7c8c73b230f22e02ddb5bf8b178b6c"
      # This must run before Cargo: a broken upstream lock must not prevent
      # exercising the source fixture's own syntax gate.
      - name: Check script syntax
        run: bash -n zed-e2e/suites/cli/attolang-source-package-boundary.sh
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' zed-cli/rust-toolchain.toml)"
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          test "$(rustc --version | awk '{print $2}')" = "$toolchain"
      - name: Cache Zed CLI build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: zed-cli -> target
      - name: Build real Zed
        working-directory: zed-cli
        run: cargo build --locked --bin zed
      - name: Verify AttoLang source artifact and negative boundary
        env:
          ZED_BIN: ${{ github.workspace }}/zed-cli/target/debug/zed
        run: bash zed-e2e/suites/cli/attolang-source-package-boundary.sh
      - name: Record proof ceiling
        run: echo 'SOURCE_ARTIFACT_ONLY - does not prove AttoLang compiler parsing or guest runtime execution'
