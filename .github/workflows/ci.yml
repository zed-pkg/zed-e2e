name: ci

# This suite's real inputs are the *sibling repos'* default branches, which
# change without any commit landing here — so a push/PR trigger alone leaves
# cross-repo breakage invisible until someone happens to touch zed-e2e.
# workflow_dispatch allows re-validating the stack on demand after a sibling
# ships; the nightly schedule catches drift nobody thought to check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-e2e
          path: zed-e2e
          persist-credentials: false
      # Sibling checkouts the harness builds and drives.
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-api-server.rs
          path: zed-api-server.rs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-web-server.rs
          path: zed-web-server.rs
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zed-cli
            zed-api-server.rs
            zed-web-server.rs

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zed-e2e/package-lock.json

      - name: Install e2e deps
        working-directory: zed-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: zed-e2e
        run: npm run typecheck

      # The harness currently starts `postgres:16-alpine`. Prime that local tag
      # with the exact pgvector image required by the API's vector migration;
      # `docker run` will use this already-present local image rather than pull
      # plain PostgreSQL from the registry.
      - name: Pin pgvector Postgres for the browser harness
        shell: bash
        run: |
          set -euo pipefail
          docker pull pgvector/pgvector:0.8.5-pg16
          docker tag pgvector/pgvector:0.8.5-pg16 postgres:16-alpine
          test "$(docker image inspect postgres:16-alpine --format '{{index .RepoDigests 0}}')" != ''

      - name: Run e2e (playwright + puppeteer + selenium)
        working-directory: zed-e2e
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: zed-e2e/playwright-report
          retention-days: 7
