name: ci

# Sibling default branches are intentional nightly compatibility inputs. Pull
# requests validate the exact GitHub-generated integration commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

# The memory backend is merged on the API default branch. Keep this as a branch
# input—not a permanent SHA pin—so the nightly suite remains a compatibility
# canary for API/CLI/web/interface drift.
env:
  ZED_E2E_API_REF: main
  # Stacked acceptance dependency for zed-pkg/zed-cli#54. Replace with that
  # PR's merge commit (or main) before this draft is promoted to main.
  ZED_E2E_CLI_REF: 48b149a12892f381b1d0c7ac3a0a0cab54a3e57f

concurrency:
  group: zed-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact PR integration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-e2e
          ref: ${{ github.sha }}
          path: zed-e2e
          persist-credentials: false
          show-progress: false

      - name: Check out zed-interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
          show-progress: false
      - name: Check out zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_E2E_CLI_REF }}
          path: zed-cli
          persist-credentials: false
          show-progress: false
      - name: Check out zed-api-server.rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-api-server.rs
          ref: ${{ env.ZED_E2E_API_REF }}
          path: zed-api-server.rs
          persist-credentials: false
          show-progress: false
      - name: Check out zed-web-server.rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-web-server.rs
          path: zed-web-server.rs
          persist-credentials: false
          show-progress: false

      - name: Verify default-branch memory backend and stacked CLI source
        run: |
          set -euo pipefail
          api_revision="$(git -C zed-api-server.rs rev-parse HEAD)"
          cli_revision="$(git -C zed-cli rev-parse HEAD)"
          test -n "$api_revision"
          test "$cli_revision" = "$ZED_E2E_CLI_REF"
          grep -q 'StorageConfig::Memory' zed-api-server.rs/src/storage.rs
          grep -q 'STORAGE_MEMORY_MAX_BYTES' zed-api-server.rs/src/config.rs
          grep -q 'R2gRegistryMode::Server' zed-cli/src/r2g.rs
          printf 'api_revision=%s\ncli_revision=%s\n' "$api_revision" "$cli_revision"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            zed-cli
            zed-api-server.rs
            zed-web-server.rs

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zed-e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: zed-e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: zed-e2e
        run: npm run typecheck

      - name: Verify collision-safe stack allocation
        working-directory: zed-e2e
        run: node --test --test-reporter=spec scripts/allocate-stack-ports.test.mjs

      # Boot once, then make every framework an external-stack consumer. This
      # is both the intended shared-state model and the correct model for a
      # process-memory registry: restarting the API between frameworks would
      # erase the packages under test. Before booting, reserve the preferred
      # ports when they are free and select ephemeral alternatives otherwise;
      # the resolved numeric ports and run-scoped container identity are
      # persisted for later consumer and teardown steps.
      - name: Start one collision-safe bounded memory-backed registry stack
        working-directory: zed-e2e
        env:
          ZED_E2E_PG_IMAGE: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:84a355869251af1a3379cfc9fa7b4dbf962c03f642a4bb7b339a203925071c43
          ZED_E2E_STORAGE_BACKEND: memory
          ZED_E2E_STORAGE_MEMORY_MAX_BYTES: "268435456"
        run: |
          set -euo pipefail
          node scripts/allocate-stack-ports.mjs --github-env "$GITHUB_ENV" -- npm run stack:up

      - name: Report resolved stack identity
        run: |
          set -euo pipefail
          printf 'run_id=%s\npg_port=%s\napi_port=%s\nweb_port=%s\ncontainer=%s\n' \
            "$ZED_E2E_RUN_ID" "$ZED_E2E_PG_PORT" "$ZED_E2E_API_PORT" \
            "$ZED_E2E_WEB_PORT" "$ZED_E2E_PG_CONTAINER"

      - name: Run e2e (Playwright, Puppeteer, Selenium)
        working-directory: zed-e2e
        run: |
          set -euo pipefail
          ZED_E2E_API_URL="http://127.0.0.1:$ZED_E2E_API_PORT" \
          ZED_E2E_WEB_URL="http://127.0.0.1:$ZED_E2E_WEB_PORT" \
            npm run e2e 2>&1 | tee "$RUNNER_TEMP/zed-e2e.log"

      - name: Prove package artifacts never touched disk
        working-directory: zed-e2e
        run: |
          set -euo pipefail
          test -d .stack/artifacts
          if find .stack/artifacts -type f -print -quit | grep -q .; then
            echo 'memory-backed publication unexpectedly wrote artifact files' >&2
            find .stack/artifacts -type f -maxdepth 4 -print >&2
            exit 1
          fi

      - name: Capture stack and generated-test diagnostics
        if: failure()
        run: |
          set +e
          destination="zed-e2e/ci-diagnostics"
          mkdir -p "$destination/stack" "$destination/generated-tests"
          cp "$RUNNER_TEMP/zed-e2e.log" "$destination/e2e.log" 2>/dev/null || true
          if test -d zed-e2e/.stack; then
            cp -a zed-e2e/.stack/. "$destination/stack/"
          fi
          docker logs "$ZED_E2E_PG_CONTAINER" > "$destination/stack/postgres.log" 2>&1 || true

          find zed-e2e zed-cli zed-api-server.rs zed-web-server.rs "$RUNNER_TEMP" \
            -type f \
            \( -name '*.test.mjs' -o -name '*.test.js' -o -name '*adapter*.mjs' -o -name '*adapter*.js' \) \
            -not -path '*/node_modules/*' -not -path '*/target/*' \
            -print > "$destination/generated-test-files.txt" 2>&1 || true

          grep -RInF --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target \
            --exclude-dir=ci-diagnostics \
            'goLive records an audit line' \
            zed-e2e zed-cli zed-api-server.rs zed-web-server.rs "$RUNNER_TEMP" \
            > "$destination/generated-test-locations.txt" 2>&1 || true
          grep -RInF --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target \
            --exclude-dir=ci-diagnostics \
            'same target from concurrent callers' \
            zed-e2e zed-cli zed-api-server.rs zed-web-server.rs "$RUNNER_TEMP" \
            >> "$destination/generated-test-locations.txt" 2>&1 || true

          while IFS= read -r source; do
            test -f "$source" || continue
            case "$source" in
              *node_modules*|*target*) continue ;;
            esac
            relative="${source#/}"
            target="$destination/generated-tests/${relative//\//__}"
            cp "$source" "$target" 2>/dev/null || true
          done < "$destination/generated-test-files.txt"

          for log in \
            "$destination/e2e.log" \
            "$destination/stack"/*.log \
            "$destination/generated-test-locations.txt" \
            "$destination/generated-test-files.txt"; do
            test -f "$log" || continue
            printf '\n===== %s =====\n' "$log"
            cat "$log"
          done

      - name: Stop the local stack
        if: always()
        working-directory: zed-e2e
        run: npm run stack:down || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            zed-e2e/playwright-report
            zed-e2e/test-results
            zed-e2e/ci-diagnostics
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
