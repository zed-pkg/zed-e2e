name: conformance-lifecycle

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'conformance/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/conformance-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'conformance/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/conformance-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d7c2439e1b4a123e78e5fbdd25b
        with:
          node-version: '22'
          cache: npm
      - name: Execute the same checker Zed lifecycles consume
        run: sh conformance/check.sh
