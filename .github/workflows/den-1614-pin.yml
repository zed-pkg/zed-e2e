name: DEN-1614 candidate pin finalizer

on:
  push:
    branches:
      - agent/den-1614-zed-develop-windows-clean-room

permissions:
  contents: write

concurrency:
  group: den-1614-candidate-pin-finalizer
  cancel-in-progress: false

jobs:
  pin-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin the exact tested CLI candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/zed-develop-windows-clean-room.yml')
          text = path.read_text(encoding='utf-8')
          old = '  ZED_CLI_SHA: dda12969da03ec1cfd05a4be0781f768fff2d743\n'
          new = '  ZED_CLI_SHA: bd34f4f494e1cc402efa7abb009b83b638480153\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one prior CLI candidate pin')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            tests/cli/test_zed_develop_windows_policy.py
          git diff --check

      - name: Commit the immutable pin and remove the finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1614-pin.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/zed-develop-windows-clean-room.yml
          git commit -m 'ci(DEN-1614): pin the Windows develop candidate'
          git push origin "HEAD:${GITHUB_REF_NAME}"
