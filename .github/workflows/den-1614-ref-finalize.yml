name: DEN-1614 ref finalizer

on:
  push:
    branches:
      - agent/den-1614-zed-develop-windows-clean-room

permissions:
  contents: write

concurrency:
  group: den-1614-ref-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and validate the final source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/den-1614-ref-finalize.py
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          for relative in (
              'tests/cli/zed_develop_windows_clean_room.py',
              'tests/cli/test_zed_develop_windows_policy.py',
          ):
              compile(Path(relative).read_text(encoding='utf-8'), relative, 'exec')
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            tests/cli/test_zed_develop_windows_policy.py
          git diff --check

      - name: Publish the validated final head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(DEN-1614): normalize equivalent Windows path spellings'
          git push origin "HEAD:${GITHUB_REF_NAME}"
