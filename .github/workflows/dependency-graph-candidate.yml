name: Dependency graph candidate E2E

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-graph-candidate.yml"
      - "harness/graph-fixtures.ts"
      - "suites/playwright/dependency-graph.spec.ts"
      - "suites/playwright/dependency-graph-projection.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Exact canonical merge commits. Immutable SHAs keep the final
  # certification run independent of moving branches.
  ZED_INTERFACES_CANDIDATE: 7d31f80dd8a310f218931165a3ad636a2f32b932
  ZED_API_CANDIDATE: 7e280f7d6a23432b5414ffeb591ca77737b1ce37
  ZED_WEB_CANDIDATE: efa3a08a44fb3fa06b440d2547ec6672963ca328
  ZED_CLI_CANDIDATE: 3265041478d6873ce3815b11930bd1e8e8004837
  ZED_CLIENTS_CANDIDATE: 799c967f44fdd7932d18432257a2bd46eff4e33a

jobs:
  graph-candidate:
    name: PostgreSQL + API + web + CLI + TypeScript client + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout E2E candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zed-e2e

      - name: Checkout zed-interfaces candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_CANDIDATE }}
          path: zed-interfaces

      - name: Checkout zed-api-server candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-api-server.rs
          ref: ${{ env.ZED_API_CANDIDATE }}
          path: zed-api-server.rs

      - name: Checkout zed-web-server candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-web-server.rs
          ref: ${{ env.ZED_WEB_CANDIDATE }}
          path: zed-web-server.rs

      - name: Checkout zed-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_CANDIDATE }}
          path: zed-cli

      - name: Checkout zed-clients candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-clients
          ref: ${{ env.ZED_CLIENTS_CANDIDATE }}
          path: zed-clients

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            zed-api-server.rs
            zed-web-server.rs
            zed-cli
          shared-key: dependency-graph-candidate

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            zed-e2e/package-lock.json
            zed-clients/clients/typescript/package-lock.json

      - name: Install E2E dependencies
        working-directory: zed-e2e
        run: npm ci

      - name: Build and test pinned TypeScript client
        working-directory: zed-clients/clients/typescript
        env:
          ZED_INTERFACES_FORMAT_FIXTURE: ${{ github.workspace }}/zed-interfaces/fixtures/dependency-graph-formats-v1.json
        run: npm ci && npm run build && npm test

      - name: Install Chromium
        working-directory: zed-e2e
        run: npx playwright install --with-deps chromium

      - name: Type-check graph tests and harness
        working-directory: zed-e2e
        run: npm run typecheck

      - name: Run harness unit tests
        working-directory: zed-e2e
        run: npm run test:harness

      - name: Boot candidate stack on allocated ports
        working-directory: zed-e2e
        env:
          ZED_E2E_STORAGE_BACKEND: memory
          ZED_E2E_ARTIFACT_SERVE_MEMORY_BUDGET_BYTES: "16777216"
          ZED_E2E_MAX_ARTIFACT_BYTES: "8388608"
        run: >-
          node scripts/allocate-stack-ports.mjs
          --github-env "$GITHUB_ENV"
          -- npm run stack:up

      - name: Run dependency graph browser, CLI, and client certification
        working-directory: zed-e2e
        env:
          ZED_E2E_DEPENDENCY_GRAPH_CANDIDATE: "1"
          ZED_E2E_EXTERNAL_STACK: "1"
          ZED_E2E_STORAGE_BACKEND: memory
          ZED_E2E_ARTIFACT_SERVE_MEMORY_BUDGET_BYTES: "16777216"
          ZED_E2E_MAX_ARTIFACT_BYTES: "8388608"
          ZED_E2E_TYPESCRIPT_CLIENT_MODULE: ${{ github.workspace }}/zed-clients/clients/typescript/dist/index.js
        run: >-
          npx playwright test
          suites/playwright/dependency-graph.spec.ts
          suites/playwright/dependency-graph-projection.spec.ts
          --project=chromium
          --workers=1

      - name: Print stack diagnostics
        if: failure()
        working-directory: zed-e2e
        run: |
          echo "API URL: ${ZED_E2E_API_URL:-unset}"
          echo "Web URL: ${ZED_E2E_WEB_URL:-unset}"
          find .e2e-state -maxdepth 1 -type f \( -name '*.log' -o -name '*.pid' \) -print -exec tail -n 250 {} \; 2>/dev/null || true

      - name: Stop candidate stack
        if: always()
        working-directory: zed-e2e
        env:
          ZED_E2E_EXTERNAL_STACK: ""
        run: npm run stack:down || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-graph-candidate-${{ github.run_id }}
          path: |
            zed-e2e/playwright-report
            zed-e2e/test-results
            zed-e2e/.e2e-state/*.log
          if-no-files-found: ignore
          retention-days: 14
