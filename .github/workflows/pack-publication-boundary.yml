name: Pack publication boundary

on:
  pull_request:
    paths:
      - ".github/workflows/pack-publication-boundary.yml"
      - "suites/cli/pack-publication-boundary.sh"
      - "suites/cli/pack-nested-publication-boundary.sh"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pack-publication-boundary.yml"
      - "suites/cli/pack-publication-boundary.sh"
      - "suites/cli/pack-nested-publication-boundary.sh"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: pack-publication-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Real CLI pack boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out zed-e2e
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: zed-e2e

      - name: Check out current zed-cli main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: zed-pkg/zed-cli
          ref: main
          path: zed-cli

      - name: Install exact Rust authority from checked-out zed-cli
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' zed-cli/rust-toolchain.toml)"
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$toolchain"
          test "$(rustc --version | awk '{print $2}')" = "$toolchain"

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: zed-cli -> target

      - name: Build the real zed CLI
        working-directory: zed-cli
        run: cargo build --locked --bin zed

      - name: Verify the primary publication boundary
        env:
          ZED_BIN: ${{ github.workspace }}/zed-cli/target/debug/zed
        run: bash zed-e2e/suites/cli/pack-publication-boundary.sh

      - name: Verify nested and generated publication boundaries
        env:
          ZED_BIN: ${{ github.workspace }}/zed-cli/target/debug/zed
        run: bash zed-e2e/suites/cli/pack-nested-publication-boundary.sh
