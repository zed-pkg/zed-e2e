name: Pack publication boundary

on:
  pull_request:
    paths:
      - ".github/workflows/pack-publication-boundary.yml"
      - "suites/cli/pack-publication-boundary.sh"
      - "suites/cli/pack-nested-publication-boundary.sh"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pack-publication-boundary.yml"
      - "suites/cli/pack-publication-boundary.sh"
      - "suites/cli/pack-nested-publication-boundary.sh"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

env:
  EXPECTED_E2E_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pack-publication-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Real CLI pack boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact zed-e2e contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_E2E_HEAD }}
          persist-credentials: false
          path: zed-e2e

      - name: Check out current zed-cli main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: zed-pkg/zed-cli
          ref: main
          path: zed-cli

      - name: Install exact CLI-declared Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(python3 - <<'PY'
          import pathlib
          import re
          import tomllib

          with pathlib.Path('zed-cli/rust-toolchain.toml').open('rb') as source:
              channel = tomllib.load(source).get('toolchain', {}).get('channel')
          if not isinstance(channel, str) or re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', channel) is None:
              raise SystemExit(f'zed-cli must declare an exact numeric Rust toolchain, got {channel!r}')
          print(channel)
          PY
          )"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          actual="$(cd zed-cli && rustc --version | awk '{print $2}')"
          test "$actual" = "$toolchain" || {
            printf 'zed-cli rustc mismatch: expected %s, got %s\n' "$toolchain" "$actual" >&2
            exit 1
          }
          printf 'zed_cli_rust_toolchain=%s\n' "$toolchain"

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: zed-cli -> target

      - name: Build the real zed CLI
        working-directory: zed-cli
        run: cargo build --locked --bin zed

      - name: Verify the primary publication boundary
        env:
          ZED_BIN: ${{ github.workspace }}/zed-cli/target/debug/zed
        run: bash zed-e2e/suites/cli/pack-publication-boundary.sh

      - name: Verify nested and generated publication boundaries
        env:
          ZED_BIN: ${{ github.workspace }}/zed-cli/target/debug/zed
        run: bash zed-e2e/suites/cli/pack-nested-publication-boundary.sh
