name: Release report consumer contract

'on':
  pull_request:
    paths:
      - '.github/workflows/release-report-consumer.yml'
      - 'tests/browser/release-report-consumer.test.mjs'
  push:
    branches: [main, master, dev]
    paths:
      - '.github/workflows/release-report-consumer.yml'
      - 'tests/browser/release-report-consumer.test.mjs'
  schedule:
    - cron: '29 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-report-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_INTEGRITY_SHA: a59acf2e08afd0f99359588cff8be8b275c7ed18

jobs:
  consumer:
    name: ${{ matrix.framework }} consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [playwright, puppeteer, selenium]
    env:
      CI: 'true'
      E2E_FRAMEWORK: ${{ matrix.framework }}
      NO_COLOR: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_ignore_scripts: 'true'
      npm_config_package_lock: 'false'
      npm_config_update_notifier: 'false'

    steps:
      - name: Check out E2E suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zed-e2e
          persist-credentials: false

      - name: Check out exact release-report candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_INTEGRITY_SHA }}
          path: zed-cli-candidate
          persist-credentials: false

      - name: Use Node.js 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Prepare isolated browser driver
        shell: bash
        working-directory: zed-e2e/tests/browser
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json package.json
          printf '%s\n' '{"name":"release-report-consumer-ci","private":true,"type":"module"}' > package.json
          artifact_dir="$GITHUB_WORKSPACE/zed-e2e/tests/browser/artifacts/${{ matrix.framework }}"
          mkdir -p "$artifact_dir"
          {
            printf 'framework=%s\n' '${{ matrix.framework }}'
            printf 'zed_cli_candidate=%s\n' "$ZED_CLI_INTEGRITY_SHA"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
            printf 'runner_os=%s\n' '${{ runner.os }}'
            printf 'runner_arch=%s\n' '${{ runner.arch }}'
          } > "$artifact_dir/environment.txt"
          case '${{ matrix.framework }}' in
            playwright)
              npm install --no-save --no-package-lock --ignore-scripts playwright@1.61.1
              ./node_modules/.bin/playwright install --with-deps chromium
              ;;
            puppeteer)
              npm install --no-save --no-package-lock --ignore-scripts puppeteer@25.3.0
              chrome_bin="$(command -v google-chrome || command -v chromium || true)"
              test -n "$chrome_bin" && test -x "$chrome_bin"
              printf 'PUPPETEER_EXECUTABLE_PATH=%s\n' "$chrome_bin" >> "$GITHUB_ENV"
              ;;
            selenium)
              npm install --no-save --no-package-lock --ignore-scripts selenium-webdriver@4.46.0
              chrome_bin="$(command -v google-chrome || command -v chromium || true)"
              test -n "$chrome_bin" && test -x "$chrome_bin"
              ;;
            *)
              echo 'unsupported framework: ${{ matrix.framework }}' >&2
              exit 64
              ;;
          esac

      - name: Generate, bind, verify, and tamper-check report artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/zed-e2e/tests/browser/artifacts/${{ matrix.framework }}"
          plan="$artifact_dir/release-plan.json"
          report="$artifact_dir/release-plan.html"
          integrity="$artifact_dir/release-plan.integrity.json"
          cat > "$plan" <<'JSON'
          {
            "release_set": "acme/sdk@1.2.3",
            "source": {
              "package": "acme/sdk",
              "version": "1.2.3",
              "vcs_tag": "v1.2.3",
              "repository": "https://github.com/acme/sdk"
            },
            "zed": [
              {"target": null, "package": "acme/sdk", "version": "1.2.3", "dir": "."},
              {"target": "nodejs", "package": "acme/sdk-node", "version": "1.2.3", "dir": "clients/typescript"}
            ],
            "native": [
              {"target": "nodejs", "registry": "npmjs", "package": "@acme/sdk", "version": "1.2.3", "vcs_tag": "clients/typescript/v1.2.3", "dir": "clients/typescript"},
              {"target": "rust", "registry": "cratesio", "package": "acme-sdk", "version": "1.2.3", "vcs_tag": "clients/rust/v1.2.3", "dir": "clients/rust"}
            ],
            "forge": [
              {"target": "golang", "registry": "github", "format": "golang", "package": "github.com/acme/sdk/clients/go", "version": "1.2.3", "vcs_tag": "clients/go/v1.2.3", "dir": "clients/go"}
            ]
          }
          JSON
          node "$GITHUB_WORKSPACE/zed-cli-candidate/scripts/render-release-plan-html.mjs" \
            --input "$plan" --output "$report"
          node "$GITHUB_WORKSPACE/zed-cli-candidate/scripts/release-plan-integrity.mjs" bind \
            --plan "$plan" --report "$report" --integrity "$integrity"
          node "$GITHUB_WORKSPACE/zed-cli-candidate/scripts/release-plan-integrity.mjs" verify \
            --plan "$plan" --report "$report" --integrity "$integrity"

          for mode in report plan; do
            tampered="$artifact_dir/tampered-$mode"
            mkdir -p "$tampered"
            cp "$plan" "$tampered/release-plan.json"
            cp "$report" "$tampered/release-plan.html"
            cp "$integrity" "$tampered/release-plan.integrity.json"
            if [ "$mode" = report ]; then
              printf '\n<!-- independent tamper canary -->\n' >> "$tampered/release-plan.html"
            else
              node -e 'const fs=require("node:fs"); const file=process.argv[1]; const plan=JSON.parse(fs.readFileSync(file,"utf8")); plan.source.version="9.9.9"; fs.writeFileSync(file, JSON.stringify(plan,null,2)+"\n");' "$tampered/release-plan.json"
            fi
            if node "$GITHUB_WORKSPACE/zed-cli-candidate/scripts/release-plan-integrity.mjs" verify \
              --plan "$tampered/release-plan.json" \
              --report "$tampered/release-plan.html" \
              --integrity "$tampered/release-plan.integrity.json"; then
              echo "tampered $mode unexpectedly verified" >&2
              exit 1
            fi
          done

      - name: Validate consumer test syntax
        shell: bash
        working-directory: zed-e2e/tests/browser
        run: node --check release-report-consumer.test.mjs

      - name: Review bound report with independent browser driver
        shell: bash
        working-directory: zed-e2e/tests/browser
        env:
          ZED_CLI_CANDIDATE: ${{ github.workspace }}/zed-cli-candidate
          RELEASE_REPORT_ARTIFACT_DIR: ${{ github.workspace }}/zed-e2e/tests/browser/artifacts/${{ matrix.framework }}
        run: node --test --test-reporter=spec release-report-consumer.test.mjs

      - name: Upload independent review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-report-consumer-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: zed-e2e/tests/browser/artifacts/${{ matrix.framework }}/
          if-no-files-found: error
          retention-days: 7
