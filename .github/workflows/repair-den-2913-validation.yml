name: Repair DEN-2913 validation scope

on:
  push:
    branches:
      - alexanderdmills/den-2913-zed-e2e-live-cloud-public-edge-workflows-still-target

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Scope counts to product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agent-den-2913.yml')
          text = path.read_text()
          old = '-- .github/workflows docs | wc -l)'
          new = '-- .github/workflows/live-opto-sync-cloud.yml .github/workflows/public-edge-readiness.yml docs/live-opto-sync-cloud.md docs/public-edge-readiness.md | wc -l)'
          if text.count(old) != 4:
              raise SystemExit(f'expected four broad count scopes, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/repair-den-2913-validation.yml
          git config user.name "alex-main-agent"
          git config user.email "alex-main-agent@users.noreply.github.com"
          git add .github/workflows/agent-den-2913.yml .github/workflows/repair-den-2913-validation.yml
          git diff --cached --check
          git commit -m "ci: scope DEN-2913 endpoint assertions"
          git push origin HEAD
