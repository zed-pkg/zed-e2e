name: tagged-e2e

on:
  # Create a tag in this repository matching the zed-cli release tag. The CLI
  # checkout is immutable, while main stays uncluttered by test-trigger commits.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      zed_cli_ref:
        description: "zed-cli tag or SHA (tags preferred)"
        required: true
        default: "81d0730d8178bc88a384109652ecad2e7f918636"
      flags_2_env_ref:
        description: "flags-2-env tag or SHA"
        required: true
        default: "2946224fb3a1bd84c0e39146b24f5f1ca8d69862"
      zed_interfaces_ref:
        description: "zed-interfaces tag, SHA, or branch"
        required: true
        default: "625ba7bdf4339df7d0880f791a0715ca894558fe"
      zed_api_ref:
        description: "zed-api-server.rs tag, SHA, or branch"
        required: true
        default: "3d2d4c98024e5bf718dc79c2648bd10d7759a31c"
      zed_web_ref:
        description: "zed-web-server.rs tag, SHA, or branch"
        required: true
        default: "b669850d317ebc07a8960aea4014706c55ffad22"

permissions:
  contents: read

concurrency:
  group: tagged-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: zed-e2e
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ inputs.zed_interfaces_ref || '625ba7bdf4339df7d0880f791a0715ca894558fe' }}
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-cli
          # A pushed v* tag in zed-e2e is expected to match a zed-cli tag.
          ref: ${{ inputs.zed_cli_ref || github.ref_name }}
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-api-server.rs
          ref: ${{ inputs.zed_api_ref || '3d2d4c98024e5bf718dc79c2648bd10d7759a31c' }}
          path: zed-api-server.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-web-server.rs
          ref: ${{ inputs.zed_web_ref || 'b669850d317ebc07a8960aea4014706c55ffad22' }}
          path: zed-web-server.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: flags-2-env/flags-2-env
          # Keep the E2E audit parser at the exact revision consumed by zed-cli.
          ref: ${{ inputs.flags_2_env_ref || '2946224fb3a1bd84c0e39146b24f5f1ca8d69862' }}
          path: flags-2-env
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Rust toolchain declared by selected zed-cli
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(python3 - <<'PY'
          import tomllib
          with open("zed-cli/rust-toolchain.toml", "rb") as source:
              print(tomllib.load(source)["toolchain"]["channel"])
          PY
          )"
          mapfile -t components < <(python3 - <<'PY'
          import tomllib
          with open("zed-cli/rust-toolchain.toml", "rb") as source:
              values = tomllib.load(source)["toolchain"].get("components", [])
          for value in values:
              print(value)
          PY
          )
          install_args=(toolchain install "$toolchain" --profile minimal --no-self-update)
          for component in "${components[@]}"; do
            install_args+=(--component "$component")
          done
          rustup "${install_args[@]}"
          rustup default "$toolchain"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            zed-cli
            zed-api-server.rs
            zed-web-server.rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Verify selected toolchain and parse tracked TOML
        run: |
          set -euo pipefail
          python3 zed-e2e/scripts/check-zed-toolchain-toml.py \
            --zed-cli-root zed-cli \
            --flags-root flags-2-env \
            --workflow zed-e2e/.github/workflows/tagged-e2e.yml
          cargo metadata \
            --manifest-path zed-cli/Cargo.toml \
            --locked \
            --no-deps \
            --format-version 1 \
            > "$RUNNER_TEMP/zed-cli-cargo-metadata.json"
          test -s "$RUNNER_TEMP/zed-cli-cargo-metadata.json"

      - name: Build flags-2-env native parser
        working-directory: flags-2-env
        run: make all

      - name: Expose native parser to zed
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/flags-2-env/build" >> "$GITHUB_ENV"

      - name: Install e2e dependencies
        working-directory: zed-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck and harness tests
        working-directory: zed-e2e
        run: |
          npm run typecheck
          npm run test:harness

      - name: Audit every zed CLI flags contract
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' specs < <(
            find zed-cli -maxdepth 1 -type f \
              \( -name '.cli-flags.toml' -o -name '.*-cli-flags.toml' \) \
              -print0 | sort -z
          )
          test "${#specs[@]}" -ge 6
          for spec in "${specs[@]}"; do
            echo "auditing $spec"
            flags-2-env/build/flags2env audit "$spec"
          done

      - name: Run full end-to-end matrix
        working-directory: zed-e2e
        run: npm run e2e

      - name: Pack flags-2-env as a zed package
        working-directory: flags-2-env
        run: ../zed-cli/target/debug/zed pack --out "$RUNNER_TEMP/flags-2-env-zpkg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: tagged-e2e-debug-${{ github.run_id }}
          path: |
            zed-e2e/playwright-report
            zed-e2e/.stack/*.log
          if-no-files-found: ignore
          retention-days: 7
