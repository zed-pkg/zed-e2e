name: zed develop Windows clean-room contract

'on':
  pull_request:
    paths:
      - '.github/workflows/zed-develop-windows-clean-room.yml'
      - 'tests/cli/zed_develop_windows_clean_room.py'
      - 'tests/cli/run_zed_develop_windows_clean_room.py'
      - 'tests/cli/test_zed_develop_windows_policy.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zed-develop-windows-clean-room.yml'
      - 'tests/cli/zed_develop_windows_clean_room.py'
      - 'tests/cli/run_zed_develop_windows_clean_room.py'
      - 'tests/cli/test_zed_develop_windows_policy.py'
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-develop-windows-clean-room-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_SHA: f28abbd462195628f05e919fd6431963a320340e
  ZED_INTERFACES_SHA: c2e049006453c26ca8ca291783f681fce75cb01f
  FLAGS2ENV_SHA: 2f62e40932a0fcb8b9bf1b4c84473e34fa3c51c7
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  windows-clean-room:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out exact E2E candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: zed-e2e
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact Zed CLI candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact interface contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Audit workflow and suite policy without mutating the checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'zed-e2e/tests/cli/zed_develop_windows_clean_room.py',
            'zed-e2e/tests/cli/run_zed_develop_windows_clean_room.py',
            'zed-e2e/tests/cli/test_zed_develop_windows_policy.py'
          )
          foreach ($path in $paths) {
            python -c "compile(open(r'$path', encoding='utf-8').read(), r'$path', 'exec')"
          }
          python -m unittest -v zed-e2e/tests/cli/test_zed_develop_windows_policy.py

      - name: Verify immutable inputs and record the toolchain
        shell: pwsh
        env:
          ARTIFACT_DIR: ${{ runner.temp }}\zed-develop-windows
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null

          $e2eRevision = (git -C zed-e2e rev-parse HEAD).Trim()
          $cliRevision = (git -C zed-cli rev-parse HEAD).Trim()
          $interfacesRevision = (git -C zed-interfaces rev-parse HEAD).Trim()
          $expectedE2e = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($e2eRevision -ne $expectedE2e) { throw "E2E revision drift: $e2eRevision" }
          if ($cliRevision -ne $env:ZED_CLI_SHA) { throw "CLI revision drift: $cliRevision" }
          if ($interfacesRevision -ne $env:ZED_INTERFACES_SHA) { throw "interface revision drift: $interfacesRevision" }

          $cargo = Get-Content -Raw zed-cli/Cargo.toml
          $expectedInterface = 'rev = "' + $env:ZED_INTERFACES_SHA + '"'
          $expectedFlags = 'rev = "' + $env:FLAGS2ENV_SHA + '"'
          if (-not $cargo.Contains($expectedInterface)) { throw 'zed-interfaces pin drifted' }
          if (-not $cargo.Contains($expectedFlags)) { throw 'flags2env pin drifted' }

          @(
            "e2e_commit=$e2eRevision",
            "zed_cli_commit=$cliRevision",
            "zed_interfaces_commit=$interfacesRevision",
            "flags2env_commit=$env:FLAGS2ENV_SHA",
            "runner_os=${{ runner.os }}",
            "runner_arch=${{ runner.arch }}",
            "rustc=$(rustc --version)",
            "cargo=$(cargo --version)",
            "python=$(python --version)",
            "pwsh=$((Get-Command pwsh.exe).Source)",
            "cmd=$env:COMSPEC"
          ) | Set-Content -Encoding utf8 "$env:ARTIFACT_DIR/environment.txt"

      - name: Build the exact Windows CLI candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --manifest-path zed-cli/Cargo.toml --bin zed
          if (-not (Test-Path 'zed-cli\target\debug\zed.exe')) {
            throw 'zed.exe was not built'
          }

      - name: Run independent Windows shell acceptance
        shell: pwsh
        env:
          ARTIFACT_DIR: ${{ runner.temp }}\zed-develop-windows
        run: |
          $ErrorActionPreference = 'Stop'
          python zed-e2e/tests/cli/run_zed_develop_windows_clean_room.py `
            --zed "$env:GITHUB_WORKSPACE\zed-cli\target\debug\zed.exe" `
            --artifact-dir "$env:ARTIFACT_DIR" `
            --candidate-sha "$env:ZED_CLI_SHA" `
            --interfaces-sha "$env:ZED_INTERFACES_SHA" `
            --flags2env-sha "$env:FLAGS2ENV_SHA"

      - name: Scan retained evidence for credential canaries
        shell: pwsh
        env:
          ARTIFACT_DIR: ${{ runner.temp }}\zed-develop-windows
        run: |
          $ErrorActionPreference = 'Stop'
          $canaries = @(
            'windows-clean-room-inherited-secret-canary',
            'windows-clean-room-registry-token-canary',
            'windows-clean-room-dotenv-canary',
            'windows-clean-room-direnv-canary',
            'windows-clean-room-production-env-canary',
            'windows-clean-room-powershell-profile-canary',
            'windows-clean-room-codex-credential-canary',
            'windows-clean-room-aws-credential-canary',
            'windows-clean-room-gcloud-credential-canary',
            'windows-clean-room-gh-credential-canary',
            'windows-clean-room-npm-credential-canary'
          )
          foreach ($file in Get-ChildItem -File -Recurse $env:ARTIFACT_DIR) {
            $content = Get-Content -Raw $file.FullName
            foreach ($canary in $canaries) {
              if ($content.Contains($canary)) {
                throw "credential canary leaked into evidence: $($file.FullName)"
              }
            }
          }

      - name: Prove all source checkouts remained clean
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($repository in @('zed-e2e', 'zed-cli', 'zed-interfaces')) {
            git -C $repository status --short
            $dirty = git -C $repository status --porcelain=v1 --untracked-files=all
            if ($dirty) { throw "$repository checkout was mutated" }
          }

      - name: Upload non-secret Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zed-develop-windows-clean-room-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\zed-develop-windows\
          if-no-files-found: error
          retention-days: 7
