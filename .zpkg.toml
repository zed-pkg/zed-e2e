[package]
org = "zed-pkg"
name = "zed-e2e"
version = "0.1.0"
description = "part of zed-pkg: end-to-end tests (Playwright, Puppeteer, Selenium) for the Rust web server, Rust API server, and zed CLI"
license = "MIT"
keywords = ["zed-pkg", "package-manager"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-e2e"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "**/target/**", "**/node_modules/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."
adapter = "none"
