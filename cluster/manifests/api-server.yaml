# dd-zed-api-server — in-cluster e2e (in-memory) profile.
#
# Differs from the production manifest (zed-api-server.rs/k8s/) on exactly the
# axes a throwaway kind cluster needs:
#   • image ghcr.io/zed-pkg/zed-api-server:dev, IfNotPresent (kind-loaded, no registry pull)
#   • STORAGE_BACKEND=local on an emptyDir{medium:Memory} — artifact blobs in RAM, no S3/R2
#   • DATABASE_URL from the in-cluster Postgres via the plain zed-secrets Secret (no ESO)
#   • AUTO_MIGRATE=true with replicas:1 — the single replica migrates on boot, no race
#   • ZED_VERIFY_TAGS=off — e2e publishes fixture packages with no real GitHub tag
#   • a NodePort Service on 30080 (kind maps host 48080 -> 30080)
# The pod hardening (non-root, read-only rootfs, drop ALL caps, seccomp) is kept
# identical to production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-zed-api-server
  namespace: zed
  labels:
    app: dd-zed-api-server
    app.kubernetes.io/name: dd-zed-api-server
    app.kubernetes.io/part-of: zed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-zed-api-server
  template:
    metadata:
      labels:
        app: dd-zed-api-server
        app.kubernetes.io/name: dd-zed-api-server
        app.kubernetes.io/part-of: zed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zed-api-server
          image: ghcr.io/zed-pkg/zed-api-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: BIND_ADDR, value: "0.0.0.0:8080" }
            # The CLI/UI reach artifacts through the host-mapped NodePort, so the
            # advertised download base must be the host URL, not the in-cluster one.
            - { name: PUBLIC_BASE_URL, value: "http://127.0.0.1:48080" }
            - { name: STORAGE_BACKEND, value: "local" }
            - { name: STORAGE_LOCAL_DIR, value: "/data/artifacts" }
            - { name: AUTO_MIGRATE, value: "true" }
            - { name: ZED_VERIFY_TAGS, value: "off" }
            - { name: MAX_ARTIFACT_BYTES, value: "104857600" }
            - { name: RUST_LOG, value: "info" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: zed-secrets, key: DATABASE_URL }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: artifacts, mountPath: /data/artifacts }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Artifact blobs live in RAM (tmpfs) — the "store artifacts in memory"
        # profile. Wiped with the pod; sizeLimit caps tmpfs against the node.
        - name: artifacts
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dd-zed-api-server
  namespace: zed
  labels:
    app: dd-zed-api-server
    app.kubernetes.io/part-of: zed
spec:
  type: NodePort
  selector:
    app: dd-zed-api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
